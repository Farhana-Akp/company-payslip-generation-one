
<div class="main">
<form  [formGroup]="addform"  (ngSubmit)="submit()">

<h1>LOGIN</h1>

<div class="formgroup">
<label>NAME</label>

<input type="name"  formControlName="name"  placeholder="name">
<div *ngIf="addform.get('name')?.touched&&addform.get('name')?.errors?.['required']">
    invalid email*
</div>
</div><br><br>

<div class="formgroup">
<label>EMAIL</label>

<input type="email"  formControlName="email"  placeholder="email">
<div *ngIf="addform.get('email')?.touched&&addform.get('email')?.errors?.['required']">
    invalid email*
</div>
<div *ngIf="addform.get('email')?.touched&&addform.get('email')?.errors?.['pattern']">
    enter a valid email*
</div>
</div><br><br>

<div class="formgroup">

<label>PASSWORD</label>

<input type="password"  formControlName="password"  placeholder="password">
<div *ngIf="addform.get('password')?.touched&&addform.get('password')?.errors?.['required']">
    invalid password*
    </div>
</div><br><br>

<div class="formgroup">
<label>CONFIRM PASSWORD</label>

<input type="password"  formControlName="confirm"  placeholder="confirm password">
<div *ngIf="addform.get('confirm')?.value!==addform.get('password')?.value">
    incorrect password*
</div>
</div><br><br>

<div class="formgroup">

<button type="submit" [disabled]="addform.invalid">REGISTER</button>
<button type="button"  (click)="login()">LOGIN</button>
</div>


</form>

</div>
